<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 2 - Social Graphs and Interactions</title>
    <style>
      :root {
        --bg: #0f1420;
        --panel: #161d2b;
        --panel-soft: #1c2436;
        --text: #e7ecf5;
        --muted: #9aa7bd;
        --line: #2a3346;
        --accent: #6c8dff;
        --accent-2: #7fd0ff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(108, 141, 255, 0.16), transparent 28%),
          linear-gradient(180deg, #0b0f18 0%, var(--bg) 100%);
        color: var(--text);
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 56px 20px 80px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
        padding: 12px 18px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(22, 29, 43, 0.72);
        backdrop-filter: blur(10px);
      }

      .brand {
        font-size: 0.95rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--text);
        text-decoration: none;
      }

      .nav {
        display: flex;
        gap: 14px;
        align-items: center;
      }

      .nav a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.95rem;
      }

      .nav a.active {
        color: var(--accent);
      }

      .hero {
        padding: 24px 4px 12px;
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }

      h1 {
        margin: 20px 0 18px;
        font-size: clamp(2.5rem, 5vw, 4.3rem);
        line-height: 1.03;
        letter-spacing: -0.06em;
      }

      .hero p {
        max-width: 620px;
        margin: 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      @media (max-width: 760px) {
        .topbar {
          flex-direction: column;
          gap: 12px;
        }

        .hero {
          padding: 20px 4px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="../index.html">Social Graphs and Interactions</a>
        <nav class="nav" aria-label="Main navigation">
          <a href="../index.html#overview">Overview</a>
          <a href="../Week1/jonathan-week1.html">Week 1</a>
          <a href="week2.html" class="active">Week 2</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div class="eyebrow">Course project</div>
          <h1>Week 2</h1>
          <p>
            This week's assignment is on its way. Check back soon for the write-up and visualization.
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
